[workspace]
resolver = "2"
members = ["crates/compendium", "crates/importer", "crates/rules", "crates/web"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
compendium = { path = "crates/compendium" }
rules = { path = "crates/rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
