[package]
name = "web"
description = "Leptos (CSR) character builder, manager and printable sheet."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
compendium.workspace = true
rules.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement",
  "Storage", "Location", "Blob", "BlobPropertyBag", "Url", "File", "FileList",
  "Request", "RequestInit", "Response", "Crypto", "Performance",
] }
